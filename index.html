<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestion DTI — Portail</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --navy:      #0b1628;
  --navy-mid:  #111f38;
  --accent:    #c8283a;
  --white:     #eef2f7;
  --muted:     rgba(238,242,247,0.5);
  --border:    rgba(255,255,255,0.08);
  --card-bg:   rgba(255,255,255,0.05);
  --card-hover:rgba(255,255,255,0.09);
}

html, body { height: 100%; overflow: hidden; }

body {
  background: var(--navy);
  color: var(--white);
  font-family: 'Inter', sans-serif;
  font-weight: 300;
}

/* ── CANVAS FOND ANIMÉ ── */
#bg-canvas {
  position: fixed;
  inset: 0;
  z-index: 0;
}

/* ── OVERLAY SALLE SERVEUR ── */
.server-overlay {
  position: fixed;
  inset: 0;
  z-index: 1;
  background:
    linear-gradient(135deg,
      rgba(11,22,40,0.82) 0%,
      rgba(11,22,40,0.60) 40%,
      rgba(11,22,40,0.75) 100%);
}

/* Lignes de rack serveur stylisées */
.server-overlay::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    repeating-linear-gradient(0deg,
      transparent,
      transparent 28px,
      rgba(255,255,255,0.018) 28px,
      rgba(255,255,255,0.018) 29px),
    repeating-linear-gradient(90deg,
      transparent,
      transparent 80px,
      rgba(255,255,255,0.012) 80px,
      rgba(255,255,255,0.012) 81px);
}

/* Halo accent rouge bas-droit */
.server-overlay::after {
  content: '';
  position: absolute;
  bottom: -15%;
  right: -5%;
  width: 50vw;
  height: 50vw;
  background: radial-gradient(circle, rgba(200,40,58,0.09) 0%, transparent 65%);
  pointer-events: none;
}

/* ── PAGE LAYOUT ── */
.page {
  position: relative;
  z-index: 2;
  height: 100vh;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: 36px 56px;
}

/* ── HEADER ── */
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-bottom: 28px;
  border-bottom: 1px solid var(--border);
  animation: fadeDown 0.6s ease both;
}

.logo img { height: 72px; width: auto; }

.datetime { text-align: right; }
#clock {
  font-family: 'Syne', sans-serif;
  font-size: 26px;
  font-weight: 600;
  letter-spacing: 2px;
}
#date {
  font-size: 11px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 1.5px;
  margin-top: 3px;
}

/* ── CENTRE ── */
.center {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 44px;
}

.greeting {
  text-align: center;
  animation: fadeUp 0.65s 0.1s ease both;
}
.greeting h1 {
  font-family: 'Syne', sans-serif;
  font-size: clamp(32px, 4vw, 52px);
  font-weight: 700;
  letter-spacing: -0.3px;
}
.greeting p {
  margin-top: 8px;
  font-size: 13px;
  color: var(--muted);
  letter-spacing: 0.6px;
}

/* ── CARTES LIENS ── */
.links {
  display: flex;
  gap: 18px;
  flex-wrap: wrap;
  justify-content: center;
  animation: fadeUp 0.65s 0.2s ease both;
}

.link-card {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 18px 26px;
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 12px;
  text-decoration: none;
  color: var(--white);
  min-width: 210px;
  transition: background 0.22s, border-color 0.22s, transform 0.22s, box-shadow 0.22s;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}

.link-card:hover {
  background: var(--card-hover);
  border-color: rgba(200,40,58,0.45);
  transform: translateY(-4px);
  box-shadow: 0 8px 28px rgba(0,0,0,0.35);
}

/* Icône configurable */
.card-icon {
  width: 44px;
  height: 44px;
  border-radius: 10px;
  background: rgba(255,255,255,0.07);
  border: 1px solid rgba(255,255,255,0.1);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: background 0.22s, border-color 0.22s;
  font-size: 22px; /* pour les emoji */
  line-height: 1;
}

.link-card:hover .card-icon {
  background: rgba(200,40,58,0.15);
  border-color: rgba(200,40,58,0.4);
}

.card-icon svg {
  width: 22px; height: 22px;
  stroke: rgba(238,242,247,0.7);
  fill: none;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
  transition: stroke 0.22s;
}
.link-card:hover .card-icon svg { stroke: #e05060; }

.card-text strong {
  display: block;
  font-size: 14px;
  font-weight: 500;
  letter-spacing: 0.1px;
}
.card-text span {
  display: block;
  font-size: 11px;
  color: var(--muted);
  margin-top: 2px;
  letter-spacing: 0.3px;
}

/* ── FOOTER ── */
footer {
  padding-top: 24px;
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  animation: fadeUp 0.65s 0.3s ease both;
}
.footer-label {
  font-size: 11px;
  color: var(--muted);
  letter-spacing: 0.8px;
  text-transform: uppercase;
  display: flex;
  align-items: center;
  gap: 8px;
}
.dot-green {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: #2ed573;
  box-shadow: 0 0 7px rgba(46,213,115,0.7);
  animation: pulse 2s ease-in-out infinite;
}

/* ── ANIMATIONS ── */
@keyframes fadeDown {
  from { opacity:0; transform:translateY(-12px); }
  to   { opacity:1; transform:translateY(0); }
}
@keyframes fadeUp {
  from { opacity:0; transform:translateY(12px); }
  to   { opacity:1; transform:translateY(0); }
}
@keyframes pulse {
  0%,100% { opacity:1; }
  50%      { opacity:0.3; }
}
</style>
</head>

<script>
/* ── HORLOGE ── */
function updateClock() {
  const now = new Date();
  const pad = n => String(n).padStart(2,'0');
  document.getElementById('clock').textContent =
    pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
  const days   = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
  const months = ['janvier','février','mars','avril','mai','juin','juillet','août',
                  'septembre','octobre','novembre','décembre'];
  document.getElementById('date').textContent =
    days[now.getDay()] + ' ' + now.getDate() + ' ' + months[now.getMonth()] + ' ' + now.getFullYear();
}
updateClock();
setInterval(updateClock, 1000);

/* ── FOND RÉSEAU DE POINTS ANIMÉ ── */
(function() {
  const canvas = document.getElementById('bg-canvas');
  const ctx    = canvas.getContext('2d');

  // Palette : points blancs + quelques points rouges (style ton image)
  const NODES = 72;
  const DIST  = 160;
  let nodes = [];

  function resize() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
  }

  function init() {
    nodes = [];
    for (let i = 0; i < NODES; i++) {
      nodes.push({
        x:  Math.random() * canvas.width,
        y:  Math.random() * canvas.height,
        vx: (Math.random() - 0.5) * 0.35,
        vy: (Math.random() - 0.5) * 0.35,
        r:  Math.random() > 0.88 ? 'red' : 'white',
        size: Math.random() * 1.8 + 1.2
      });
    }
  }

  function draw() {
    // Fond dégradé salle serveur
    const grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
    grad.addColorStop(0,   '#0b1628');
    grad.addColorStop(0.5, '#0e1e38');
    grad.addColorStop(1,   '#091522');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Connexions
    for (let i = 0; i < nodes.length; i++) {
      for (let j = i+1; j < nodes.length; j++) {
        const dx = nodes[i].x - nodes[j].x;
        const dy = nodes[i].y - nodes[j].y;
        const d  = Math.sqrt(dx*dx + dy*dy);
        if (d < DIST) {
          const alpha = (1 - d/DIST) * 0.22;
          ctx.beginPath();
          ctx.moveTo(nodes[i].x, nodes[i].y);
          ctx.lineTo(nodes[j].x, nodes[j].y);
          ctx.strokeStyle = `rgba(180,200,230,${alpha})`;
          ctx.lineWidth = 0.8;
          ctx.stroke();
        }
      }
    }

    // Noeuds
    nodes.forEach(n => {
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.size, 0, Math.PI*2);
      if (n.r === 'red') {
        ctx.fillStyle = 'rgba(210,50,60,0.85)';
        // halo rouge
        ctx.shadowColor = 'rgba(210,50,60,0.6)';
        ctx.shadowBlur  = 6;
      } else {
        ctx.fillStyle = 'rgba(220,232,248,0.75)';
        ctx.shadowColor = 'rgba(200,220,255,0.3)';
        ctx.shadowBlur  = 3;
      }
      ctx.fill();
      ctx.shadowBlur = 0;
    });

    // Déplacement
    nodes.forEach(n => {
      n.x += n.vx;
      n.y += n.vy;
      if (n.x < 0 || n.x > canvas.width)  n.vx *= -1;
      if (n.y < 0 || n.y > canvas.height) n.vy *= -1;
    });

    requestAnimationFrame(draw);
  }

  resize();
  init();
  draw();
  window.addEventListener('resize', () => { resize(); init(); });
})();
</script>
</body>
</html>
